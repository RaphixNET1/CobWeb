<!-- CWC -->
<svg viewBox="0 0 100 100" [attr.preserveAspectRatio]="variant() === 'corner' ? 'xMaxYMin meet' : 'xMidYMid meet'">
  @for (spoke of web().spokes; track $index) {
    <path class="cobweb__thread cobweb__thread--spoke" [attr.d]="spoke.d" pathLength="1" [style.animation-delay]="spoke.delay" />
  }
  @for (ring of web().rings; track $index) {
    <path class="cobweb__thread" [attr.d]="ring.d" pathLength="1" [style.animation-delay]="ring.delay" />
  }
  @for (dew of web().dews; track $index) {
    <circle class="cobweb__dew" [attr.cx]="dew.x" [attr.cy]="dew.y" r="1" [style.animation-delay]="dew.delay" />
  }
</svg>
