<div class="filter" [class.is-locked]="loading()">
  <div class="filter__search">
    <input
      #search
      type="search"
      class="filter__input"
      placeholder="Search location … (Enter)"
      inputmode="search"
      [disabled]="loading()"
      (input)="onSearchInput($event)"
      (keydown.enter)="onSearchSubmit(search.value)"
    />

    @if (searching()) {
      <span class="filter__spinner" aria-hidden="true"></span>
    } @else if (search.value) {
      <button type="button" class="filter__clear" [disabled]="loading()" (click)="search.value = ''; clear()">✕</button>
    }
  </div>

  @if (suggestions().length) {
    <ul class="filter__results">
      @for (place of suggestions(); track place.id) {
        <li>
          <button type="button" class="filter__result" (click)="select(place)">
            <lucide-icon [img]="MapPin" [size]="18" aria-hidden="true" />
            <span class="filter__result-text">
              <span class="filter__result-name">{{ place.name }}</span>
              @if (place.region) {
                <span class="filter__result-region">{{ place.region }}</span>
              }
            </span>
          </button>
        </li>
      }
    </ul>
  }

  <div class="filter__radius">
    <div class="filter__radius-head">
      <span class="filter__label">
        <lucide-icon [img]="Navigation" [size]="16" aria-hidden="true" />
        Radius
      </span>
      <span class="filter__value">{{ radiusKm() }} km</span>
    </div>

    <input
      type="range"
      class="filter__range"
      aria-label="Searchradius in kilometers"
      min="1"
      [max]="maxRadiusKm()"
      step="1"
      [disabled]="loading()"
      [value]="radiusKm()"
      (input)="onRadiusInput($event)"
    />
  </div>

  @if (selectedName(); as name) {
    <button type="button" class="filter__chip" [disabled]="loading()" (click)="search.value = ''; clear()">
      <span class="filter__chip-text">{{ name }} · {{ radiusKm() }} km</span>
      <lucide-icon [img]="XCircle" [size]="16" aria-hidden="true" />
    </button>

    <button
      type="button"
      class="filter__search-btn"
      [disabled]="loading()"
      (click)="searchRequested.emit()"
    >
      @if (loading()) {
        <span class="filter__btn-spinner" aria-hidden="true"></span> Scanning …
      } @else {
        <lucide-icon [img]="Search" [size]="16" aria-hidden="true" /> Find leads
      }
    </button>
  }


</div>
