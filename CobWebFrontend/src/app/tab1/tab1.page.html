<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <span class="gradient-logo">map
      </span>
    </ion-title>
    <ion-buttons slot="end">
      <img src="assets/icon/CobWebLogoTransparentv1.png" alt="CobWeb" style="height: 60px; margin-right: 12px;" />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [scrollY]="false">
  <div class="map-page">
    <app-map-view [center]="center()" [radiusKm]="radiusKm()" />

    <div class="map-page__overlay">
      <app-location-filter
        [radiusKm]="radiusKm()"
        [maxRadiusKm]="maxRadiusKm"
        (placeSelected)="center.set($event)"
        (radiusChanged)="radiusKm.set($event)"
      />

     <!--

      @if (center(); as place) {
        <p class="map-page__summary">
          <strong>{{ placesInRadius().length }}</strong>
          {{ placesInRadius().length === 1 ? 'Location' : 'Locations' }} within a radius of
          {{ radiusKm() }} km around {{ place.name }}
        </p>
      }-->
    </div>
  </div>
</ion-content>
